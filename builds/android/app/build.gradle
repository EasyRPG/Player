apply plugin: 'com.android.application'

android {
    namespace = "org.easyrpg.player"
    ndkVersion = "28.2.13676358"
    assetPacks = [":assets"]
    buildFeatures {
        prefab = true
    }
    defaultConfig {
        applicationId "org.easyrpg.player"
        compileSdkVersion 37
        minSdkVersion 23
        targetSdkVersion 37
        versionName VERSION_NAME
        versionCode Integer.parseInt(VERSION_CODE)
    }
    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            ndk {
                abiFilters = []
                abiFilters.addAll(ABI_FILTERS_DEBUG.split(','))
            }
        }
        release {
            ndk {
                abiFilters = []
                abiFilters.addAll(ABI_FILTERS_RELEASE.split(','))
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig = signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
            version = "3.22.1"
        }
    }
    lint {
        abortOnError = false
        disable 'MissingTranslation'
    }
    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DPLAYER_GRADLE_BUILD=ON",
                        "-DBUILD_SHARED_LIBS=ON",
                        "-DPLAYER_ENABLE_TESTS=OFF"

                if (project.hasProperty("toolchainDirs") && project.toolchainDirs) {
                    arguments.add('-DPLAYER_ANDROID_TOOLCHAIN_PATH=' + project.toolchainDirs)
                } else if (System.getenv('EASYRPG_BUILDSCRIPTS')) {
                    arguments.add('-DPLAYER_ANDROID_TOOLCHAIN_PATH=' + System.getenv('EASYRPG_BUILDSCRIPTS') + '/android')
                }

                if (project.hasProperty("cmakeOptions")) {
                    arguments.addAll(project.cmakeOptions.split(" "))
                }
            }
        }
    }
}

allprojects {
    repositories {
        maven {
            url = 'https://maven.google.com'
        }
    }
}

dependencies {
    implementation files(fetchSdlAar())
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation "androidx.activity:activity:1.13.0"
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'org.ini4j:ini4j:0.5.4'
}

def fetchSdlAar() {
    def sdlAarFile = layout.projectDirectory.file("SDL3-${sdlVersion}.aar").asFile
    if (sdlAarFile.exists()) {
        return sdlAarFile
    }

    def sdlZipFile = layout.buildDirectory.file("SDL3-devel-${sdlVersion}-android.zip").get().asFile
    sdlZipFile.parentFile.mkdirs()
    println "Downloading SDL ${sdlVersion} AAR..."
    new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip")
        .withInputStream { i -> sdlZipFile.withOutputStream { it << i } }
    copy {
        from zipTree(sdlZipFile)
        into sdlAarFile.parentFile
        include '**/*.aar'
        eachFile { fcp ->
            fcp.relativePath = new RelativePath(true, "SDL3-${sdlVersion}.aar")
        }
        includeEmptyDirs = false
    }
    return sdlAarFile
}
